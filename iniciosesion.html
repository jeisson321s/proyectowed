<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>PlayExpert - Iniciar Sesión</title>
  <link rel="stylesheet" href="estilo_inicio_registro.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

  <main class="registro-container">
    <div class="card-registro">
      <h2>Iniciar Sesión</h2>
      <form id="loginForm">
        <div class="grupo-formulario">
          <label for="correo">Correo Electrónico:</label>
          <input type="email" id="correo" required placeholder="ejemplo@correo.com">
        </div>
        
        <div class="grupo-formulario">
          <label for="password">Contraseña:</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn-submit">Ingresar</button>
      </form>

      <!-- Enlace añadido para ir a la página de registro -->
      <p class="footer-link" style="text-align: center; margin-top: 20px;">
        ¿No tienes una cuenta? <a href="registro.html" style="color: #3b82f6; text-decoration: none;">Regístrate aquí</a>
      </p>
    </div>
  </main>

  <script type="module" src="iniciosesion.js"></script>
</body>
</html>
